name: Leitura do Dia (IA)

on:
  schedule:
    - cron: '20 11,21 * * *'  # 08h20 e 18h20 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leitura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar leitura do dia com Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update-leitura-ia.py

      - name: Commit
        run: |
          git config user.name "leitura-ia-bot"
          git config user.email "actions@github.com"
          git add leitura-ia.json
          git diff --cached --quiet || git commit -m "chore: leitura do dia (IA) [skip ci]"
          git pull --rebase origin main
          git push
