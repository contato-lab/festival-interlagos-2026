name: Alerta Central - publicacao nova

on:
  schedule:
    # A cada 10 minutos. O agendador do GitHub atrasa e pula, entao o intervalo
    # real fica maior; durante o evento o que importa e nao demorar meia hora.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Manda mensagem de teste mesmo sem novidade'
        required: false
        default: 'false'

# Duas rodadas ao mesmo tempo brigariam pelo arquivo de estado e uma sobrescreveria
# a outra, reenviando alerta ja enviado. Uma por vez, e a nova espera a anterior.
concurrency:
  group: alerta-central
  cancel-in-progress: false

jobs:
  alertar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Procurar publicacao nova e avisar
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_TESTE:       ${{ github.event.inputs.modo_teste }}
        run: python alerta-central.py

      - name: Guardar o que ja foi avisado
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add alerta-central-state.json
          if git diff --staged --quiet; then
            echo "sem mudanca de estado"; exit 0
          fi
          git commit -m "chore: estado do alerta da Central [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>&1 || git rebase --abort 2>/dev/null || true
            git push 2>&1 && { echo "push ok ($i)"; exit 0; }
            sleep $((RANDOM % 8 + 3))
          done
          echo "push falhou"; exit 1
